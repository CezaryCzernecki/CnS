[tool.poetry]
name = "cyrk_na_szynach"
version = "1.0.0"
description = "System kolekcjonowania danych o opóźnieniach PKP PLK"
authors = ["Twoje Imię <email@example.com>"]
readme = "README.md"
packages = [{ include = "cns" }]

[tool.poetry.dependencies]
python = "^3.11"
requests = "^2.31.0"
python-dotenv = "^1.0.0"
psycopg = {version = "^3.1", extras = ["binary"], optional = true}
fastapi = {version = "^0.115.0", optional = true}
uvicorn = {version = "^0.32.0", extras = ["standard"], optional = true}
pandas = {version = "^2.0.0", optional = true}
joblib = {version = "^1.3.0", optional = true}

[tool.poetry.extras]
postgres = ["psycopg"]
api = ["fastapi", "uvicorn", "psycopg"]
ml = ["pandas", "joblib", "psycopg"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^5.0.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.0"
pandas = "^2.0.0"
joblib = "^1.3.0"

[tool.poetry.scripts]
cns = "cns.__main__:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry-core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["cns/tests"]

[tool.coverage.run]
source = ["cns"]
omit = ["cns/tests/*"]
